# AmneziaWG 3.1 + веб-интерфейс: https://hub.docker.com/r/myceliummesh/amneziawg-ui
# Статья про миграцию 2.0 → 3.1: https://habr.com/ru/articles/1080342/
#
# Как запустить:
#   1. cp .env.example .env
#      Заполните WEB_UI_PASSWORD (и при необходимости DEFAULT_PORT / DEFAULT_*).
#   2. docker compose pull
#   3. docker compose up -d
#   4. Веб-UI: только localhost + SSH-туннель (см. quickstart.md).
#
# Ветвь amnezia-wg-docker-v01 — стек 3.1. Ветка main остаётся на AWG 2.0.
# Данные 2.0 (старый awg-data) с этим образом несовместимы — нужен чистый том и новые клиенты.

services:
  awg-with-ui:
    image: myceliummesh/amneziawg-ui:3.1
    container_name: awg-with-ui
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

    env_file:
      - .env

    # VPN (UDP) — снаружи для клиентов; веб-UI (TCP) — только 127.0.0.1.
    ports:
      - "${DEFAULT_PORT:-54844}:${DEFAULT_PORT:-54844}/udp"
      - "127.0.0.1:${WEB_UI_PORT:-54845}:${WEB_UI_PORT:-54845}/tcp"

    # Состояние панели и туннелей. Не смешивайте с каталогом от AWG 2.0.
    volumes:
      - ./awg-data:/etc/amnezia

    logging:
      options:
        max-size: "10m"
        max-file: "3"
